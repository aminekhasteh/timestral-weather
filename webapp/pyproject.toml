[project]
name = "timestral-weather-app"
version = "0.1.0"
description = "7-day temperature forecast web app powered by Mistral's Timestral"
requires-python = ">=3.10"
dependencies = [
    "timestral @ git+https://github.com/mistralai/timestral.git",
    "torch>=2.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.24",
    "pandas>=2.0",
    "tzdata",
]

[tool.uv]
package = false
